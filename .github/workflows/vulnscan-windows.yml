name: VulnScan Windows build

# Builds VulnScan.exe on Windows, runs the tests, then runs the built program
# against every live public source and checks each API's real field names.
# Download the program from this run's "Artifacts" section.

on:
  push:
    paths: ['vulnscan/**', '.github/workflows/vulnscan-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: vulnscan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Build VulnScan.exe
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/vulnscan.spec

      - name: Check every source's live address and field names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python tools/check_sources.py

      - name: Run the built program against the live sources (self-test)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python tools/ci_selftest.py dist/VulnScan.exe selftest

      - name: Add README
        run: Copy-Item README.md dist\README.md

      - uses: actions/upload-artifact@v4
        with:
          name: VulnScan-windows
          path: |
            vulnscan/dist/VulnScan.exe
            vulnscan/dist/README.md
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: selftest-results
          path: |
            vulnscan/selftest/
          retention-days: 14

<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Build a Life — a colourful, friendly life simulation game for children aged 5 to 15.">
  <meta name="theme-color" content="#9775FA">
  <title>Build a Life</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="cloud c1">☁️</span><span class="cloud c2">☁️</span><span class="cloud c3">☁️</span>
    <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span><span class="bubble b4"></span>
  </div>
  <div id="app" class="app">
    <noscript><p style="padding:2rem;font-size:1.3rem">Build a Life needs JavaScript turned on to play. 🙂</p></noscript>
  </div>
  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script>BAL.UI.init();</script>
</body>
</html>
